# DiskMind Release 流水线
#
# 触发方式(二选一,按用途选):
#   1. push tag → 正式发版,自动创建 GitHub Release 草稿(永久产物)
#      git tag -a v0.2.0 -m "Release v0.2.0" && git push origin v0.2.0
#   2. workflow_dispatch → 日常调试/内部分发,只产 Artifact(30 天保留,不创建 Release)
#      GitHub → Actions → "Release" → "Run workflow"
#
# 产物去向:
#   - tag 触发  → GitHub Releases 页(草稿,需手动 Publish) + Artifact
#   - 手动触发 → 只有 Artifact(进入对应 run 的 Summary 页下载)
#
# 平台矩阵:
#   - macOS Apple Silicon (.dmg + .app.tar.gz)
#   - macOS Intel         (.dmg + .app.tar.gz)
#   - Windows x64         (.msi + .exe)
#
# 已知限制(首版未做):
#   - macOS 未做 Apple Developer ID 签名 + Notarization → 首次打开需右键"打开"绕过 Gatekeeper
#   - Windows 未做 EV Code Signing → SmartScreen 会警告"未知发布者"
#   - 未集成 tauri-plugin-updater(Round 11 永久决策),用户需自行从 Release 页下载

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # 手动触发不需要输入版本号:产物按 commit sha 区分,只走 Artifact 不创建 Release

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            label: macos-aarch64
            rust_targets: 'aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            label: macos-x86_64
            rust_targets: 'x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
            label: windows-x64
            rust_targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Rust stable with target
        if: matrix.rust_targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Rust stable
        if: matrix.rust_targets == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './app/src-tauri -> target'

      # frozen-lockfile 强制按 pnpm-lock.yaml 安装,防止 CI 端解析出与本地不一致的版本(漂移)
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests (smoke gate)
        working-directory: app
        run: pnpm test

      - name: Run frontend typecheck
        working-directory: app
        run: pnpm exec vue-tsc --noEmit

      - name: Run backend tests (smoke gate)
        working-directory: app/src-tauri
        run: cargo test --lib

      # tag 触发分支:tauri-action 自带 Release 草稿创建逻辑
      - name: Build & publish to GitHub Release (tag trigger)
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "DiskMind ${{ github.ref_name }}"
          releaseBody: |
            ## DiskMind 桌面磁盘分析与清理工具

            > 跨平台构建产物 — macOS / Windows

            ### 平台支持

            - macOS Apple Silicon (`*-aarch64.dmg`)
            - macOS Intel (`*-x86_64.dmg`)
            - Windows x64 (`*-x64-setup.exe` / `*-x64_en-US.msi`)

            ### 首次安装注意

            **macOS**:本版本**未做 Apple Developer ID 签名 + Notarization**(Round 11 永久决策,详见开发待办 §2.4),首次打开会被 Gatekeeper 拦截。在 Terminal 执行一次即可:
            ```
            xattr -dr com.apple.quarantine /Applications/DiskMind.app
            ```
            或右键点击 `.app` → "打开" → 在弹出的警告框中再点"打开"。

            **Windows**:本版本**未做 EV Code Signing**(同上决策),SmartScreen 会显示"未知发布者"警告。点 "更多信息 → 仍要运行" 即可。

            ### 不支持自动更新

            DiskMind v1 系列**不集成自动更新**(Round 11 决策)。新版本发布时,请重新访问本页面下载覆盖安装。

            ### 完整变更日志

            参见 [开发待办文档 §0 当前状态](https://github.com/${{ github.repository }}/blob/main/design/2026-05-25-05-DiskMind%E5%BC%80%E5%8F%91%E5%BE%85%E5%8A%9E-98%25.md)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # 手动触发分支:只构建不创建 Release(不传 tagName/releaseName)
      - name: Build only (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }}

      # 手动触发时把产物上传成 Artifact,在 run 的 Summary 页可下载,30 天后自动清理
      - name: Upload artifacts (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: diskmind-${{ matrix.label }}-${{ github.sha }}
          path: |
            app/src-tauri/target/*/release/bundle/dmg/*.dmg
            app/src-tauri/target/*/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/*/release/bundle/msi/*.msi
            app/src-tauri/target/*/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30
